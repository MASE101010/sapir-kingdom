# Puts the site and the API on Cloudflare Pages whenever the kingdom changes.
name: deploy
on:
  push: { branches: [main], paths: ['site/**', 'functions/**', 'migrations/**', 'wrangler.toml', 'cron/**'] }
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && node tools/env.mjs
        env: { KINGDOM_ENV: '${{ secrets.KINGDOM_ENV }}' }
      - if: env.READY == '1'
        run: node tools/check.mjs
      - if: env.READY == '1'
        run: npx wrangler@3 d1 migrations apply sapir-kingdom --remote
      - if: env.READY == '1'
        run: npx wrangler@3 pages deploy site --project-name sapir-kingdom --branch main --commit-dirty=true
      - if: env.READY == '1'
        name: the kingdom's clock (a Worker woken every minute)
        continue-on-error: true
        run: npx wrangler@3 deploy --config cron/wrangler.toml
