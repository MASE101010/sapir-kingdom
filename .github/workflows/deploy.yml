# Puts the site and the API on Cloudflare Pages whenever the kingdom changes.
name: deploy
on:
  push: { branches: [main], paths: ['site/**', 'functions/**', 'migrations/**', 'wrangler.toml'] }
  workflow_dispatch: { inputs: { sync_secrets: { description: 'Copy the API secrets to Cloudflare too', type: boolean, default: false } } }
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node tools/check.mjs
      - run: npx wrangler@3 d1 migrations apply sapir-kingdom --remote
      - if: ${{ inputs.sync_secrets }}
        run: |
          for k in META_APP_SECRET IG_VERIFY_TOKEN IG_TOKEN IG_USER_ID EXPORT_TOKEN; do printf '%s' "${!k}" | npx wrangler@3 pages secret put $k --project-name sapir-kingdom; done
          printf '%s' "$SITE_URL" | npx wrangler@3 pages secret put SITE_URL --project-name sapir-kingdom
        env: { META_APP_SECRET: '${{ secrets.META_APP_SECRET }}', IG_VERIFY_TOKEN: '${{ secrets.IG_VERIFY_TOKEN }}', IG_TOKEN: '${{ secrets.IG_TOKEN }}', IG_USER_ID: '${{ secrets.IG_USER_ID }}', EXPORT_TOKEN: '${{ secrets.EXPORT_TOKEN }}', SITE_URL: '${{ vars.SITE_URL }}' }
      - run: npx wrangler@3 pages deploy site --project-name sapir-kingdom --branch main --commit-dirty=true
