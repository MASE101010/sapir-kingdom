# Every 20 minutes: new commenters get a house and an answer (tools/poll.mjs). Works before any Meta app review.
name: poll
on: { schedule: [{ cron: '*/20 * * * *' }], workflow_dispatch: }
concurrency: { group: poll, cancel-in-progress: true }
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: node tools/env.mjs
        env: { KINGDOM_ENV: '${{ secrets.KINGDOM_ENV }}' }
      - run: node tools/poll.mjs
