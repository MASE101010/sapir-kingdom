# Every 5 minutes: new commenters get a house and an answer (tools/poll.mjs → the site's /api/sync). Works before any Meta app review.
name: poll
on: { schedule: [{ cron: '*/5 * * * *' }], workflow_dispatch: }
concurrency: { group: poll, cancel-in-progress: true }
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: node tools/env.mjs
        env: { KINGDOM_ENV: '${{ secrets.KINGDOM_ENV }}' }
      - if: env.READY == '1'
        run: node tools/poll.mjs
        env: { DEBUG: '${{ github.event_name == 'workflow_dispatch' run: node tools/poll.mjsrun: node tools/poll.mjs '1' || '' }}' }
