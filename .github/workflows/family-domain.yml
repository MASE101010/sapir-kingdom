# חיבור דומיין לאתר משפחת ספיר ב-Cloudflare Pages. הרצה ידנית: עם domain ריק רק מציג את הדומיינים בחשבון.
name: family-domain
on:
  workflow_dispatch:
    inputs:
      fix_dns:
        description: "לתקן רשומות DNS (למחוק A ישנות וליצור CNAME ל-Pages)"
        default: "false"
      domain: { description: "הדומיין לחיבור (למשל sapirfamily.co.il), ריק = רק רשימה", required: false, default: "" }
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - name: credentials
        env: { KINGDOM_ENV: '${{ secrets.KINGDOM_ENV }}' }
        run: |
          echo "$KINGDOM_ENV" | grep -E '^(CLOUDFLARE_API_TOKEN|CLOUDFLARE_ACCOUNT_ID)=' | while IFS= read -r line; do v="${line#*=}"; echo "::add-mask::$v"; echo "$line" >> $GITHUB_ENV; done
      - name: who is this Cloudflare account
        run: |
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -s -H "$H" "https://api.cloudflare.com/client/v4/user" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result') or {}; print('::notice title=user::' + str(r.get('email') or ('(token is account-scoped, no user email) ' + str(d.get('errors')))))"
          curl -s -H "$H" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result') or {}; print('::notice title=account::' + str(r.get('name')) + ' | id ends with ' + str(r.get('id',''))[-6:])"
          curl -s -H "$H" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/members?per_page=20" | python3 -c "import sys,json; d=json.load(sys.stdin); print('::notice title=members::' + ', '.join((m.get('user') or {}).get('email','?') for m in d.get('result') or []) + ' ' + str(d.get('errors') or ''))"
      - name: zones in the account
        run: |
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -s -H "$H" "https://api.cloudflare.com/client/v4/zones?per_page=50" | python3 -c "
          import sys,json; d=json.load(sys.stdin)
          print('success:', d.get('success'), 'errors:', d.get('errors'))
          for z in d.get('result',[]): print('ZONE', z['name'], z['status'], z['id'])" | tee zones.txt
          grep ZONE zones.txt | sed 's/^/::notice title=zone::/' || echo "::notice::no zones visible (token may lack Zone:Read, or the domain is not on Cloudflare yet)"
          # zone עדיין pending: מבקשים מ-Cloudflare לבדוק עכשיו את שרתי השמות, ומדפיסים מה DNS ציבורי רואה
          for ZID in $(grep ' pending ' zones.txt | awk '{print $4}'); do
            curl -s -X PUT -H "$H" "https://api.cloudflare.com/client/v4/zones/$ZID/activation_check" | python3 -c "import sys,json; d=json.load(sys.stdin); print('activation_check:', d.get('success'), d.get('errors'))" | sed 's/^/::notice::/'
          done
          for Z in $(grep ZONE zones.txt | awk '{print $2}'); do
            for U in "https://$Z/" "http://$Z/" "https://www.$Z/"; do echo "::notice title=HTTP $U::$(curl -sI -m 15 "$U" | tr -d '\r' | grep -iE '^(HTTP|location|server|cf-ray)' | tr '\n' ' ')"; done
            echo "::notice title=public NS $Z::$(dig +short NS $Z @8.8.8.8 | tr '\n' ' ')"
            echo "::notice title=public A $Z::$(dig +short A $Z @8.8.8.8 | tr '\n' ' ')"
            curl -s "https://dns.google/resolve?name=$Z&type=NS" | python3 -c "import sys,json; d=json.load(sys.stdin); print('dns.google NS:', [a['data'] for a in d.get('Answer',[])])" | sed 's/^/::notice::/'
          done
          curl -s -H "$H" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/sapir-family-site/domains" | python3 -c "
          import sys,json; d=json.load(sys.stdin); print('pages domains:', [x['name']+':'+x['status'] for x in d.get('result',[])], d.get('errors'))" | sed 's/^/::notice::/'
      - name: add the zone to Cloudflare (if it is not there yet) and show its nameservers
        if: inputs.domain != ''
        run: |
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"; D="${{ inputs.domain }}"
          ZID=$(curl -s -H "$H" "https://api.cloudflare.com/client/v4/zones?name=$D" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result',[]); print(r[0]['id'] if r else '')")
          if [ -z "$ZID" ]; then
            curl -s -X POST -H "$H" -H 'content-type: application/json' "https://api.cloudflare.com/client/v4/zones" -d "{\"name\":\"$D\",\"account\":{\"id\":\"$CLOUDFLARE_ACCOUNT_ID\"},\"type\":\"full\"}" > zone.json
            python3 -c "import json; d=json.load(open('zone.json')); print('create zone:', d.get('success'), d.get('errors'))" | sed 's/^/::notice::/'
          fi
          curl -s -H "$H" "https://api.cloudflare.com/client/v4/zones?name=$D" | python3 -c "
          import sys,json; d=json.load(sys.stdin); r=d.get('result',[])
          if r: print('::notice title=NAMESERVERS::' + ' , '.join(r[0].get('name_servers',[])) + ' | status: ' + r[0]['status'])
          else: print('::warning::zone not available:', d.get('errors'))"
      - name: attach domain to the Pages project
        if: inputs.domain != ''
        run: |
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"; D="${{ inputs.domain }}"; ACC="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          for name in "$D" "www.$D"; do
            curl -s -X POST -H "$H" -H 'content-type: application/json' "$ACC/pages/projects/sapir-family-site/domains" -d "{\"name\":\"$name\"}" | python3 -c "import sys,json; d=json.load(sys.stdin); print('$name ->', d.get('success'), d.get('errors'))" | sed 's/^/::notice::/'
          done
          ZID=$(curl -s -H "$H" "https://api.cloudflare.com/client/v4/zones?name=$D" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result',[]); print(r[0]['id'] if r else '')")
          if [ -n "$ZID" ]; then
            curl -s -H "$H" "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records?per_page=100" | python3 -c "
          import sys,json; d=json.load(sys.stdin)
          print('::notice::dns errors:', d.get('errors'))
          for x in d.get('result') or []: print('::notice title=dns::%s %s -> %s (%s) id=%s' % (x['type'], x['name'], x['content'][:40], 'proxied' if x.get('proxied') else 'dns only', x['id']))"
            # ניסיון תיקון: מחיקת רשומות A/AAAA של השורש ו-www, ויצירת CNAME ל-Pages (דורש הרשאת DNS:Edit)
            if [ "${{ inputs.fix_dns }}" = "true" ]; then
              curl -s -H "$H" "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records?per_page=100" | python3 -c "
          import sys,json; d=json.load(sys.stdin)
          for x in d.get('result') or []:
            if x['type'] in ('A','AAAA') and x['name'] in ('$D','www.$D'): print(x['id'])" | while read rid; do
                curl -s -X DELETE -H "$H" "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records/$rid" | python3 -c "import sys,json; d=json.load(sys.stdin); print('::notice::deleted $rid ->', d.get('success'), d.get('errors'))"
              done
              for name in "$D" "www.$D"; do
                curl -s -X POST -H "$H" -H 'content-type: application/json' "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records" -d "{\"type\":\"CNAME\",\"name\":\"$name\",\"content\":\"sapir-family-site.pages.dev\",\"proxied\":true,\"ttl\":1}" | python3 -c "import sys,json; d=json.load(sys.stdin); print('::notice::CNAME $name ->', d.get('success'), d.get('errors'))"
              done
            fi
            curl -s -H "$H" "https://api.cloudflare.com/client/v4/zones/$ZID" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result') or {}; print('::notice title=zone-status::' + str(r.get('status')) + ' | ns: ' + ','.join(r.get('name_servers',[])) + ' | original ns: ' + ','.join(r.get('original_name_servers') or []))"
            curl -s -H "$H" "https://api.cloudflare.com/client/v4/zones/$ZID/ssl/universal/settings" | python3 -c "import sys,json; d=json.load(sys.stdin); print('::notice title=ssl::', d.get('result'), d.get('errors'))"
          else
            echo "::warning::the zone $D is not in this Cloudflare account; DNS must be set at the registrar: CNAME $D -> sapir-family-site.pages.dev and CNAME www -> sapir-family-site.pages.dev"
          fi
