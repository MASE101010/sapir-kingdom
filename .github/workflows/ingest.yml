# The daily count, an hour before the daily run: residents snapshot + the latest reel's comments with their likes (inbox/).
name: ingest
on:
  schedule: [{ cron: '0 13 * * *' }]      # 16:00 in Israel in summer time, 15:00 in winter
  workflow_dispatch:
concurrency: { group: kingdom, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/env.mjs
        env: { KINGDOM_ENV: '${{ secrets.KINGDOM_ENV }}' }
      - if: env.READY == '1'
        run: node tools/ingest.mjs
      - if: env.READY == '1'
        run: |
          git config user.name "kingdom-bot"; git config user.email "kingdom-bot@users.noreply.github.com"
          git add site/data/residents.json site/data/kingdom.json site/data/wishes.json site/data/votes.json inbox/ && git commit -m "count: day $(node -p "require('./site/data/kingdom.json').day")" && git push || echo "nothing new"
